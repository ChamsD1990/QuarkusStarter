# ============================================================
# SERVER CONFIGURATION
# ============================================================
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=*

# ============================================================
# MAIN DATABASE - SQL SERVER (Untuk Data Utama)
# ============================================================
quarkus.datasource.db-kind=mssql
quarkus.datasource.username=sa
quarkus.datasource.password=Admin123!@#
quarkus.datasource.jdbc.url=jdbc:sqlserver://NURCHAMDANI;databaseName=DataDBENT;encrypt=true;trustServerCertificate=true
quarkus.datasource.db-version=16.0.0

# Hibernate ORM untuk SQL Server
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.database.version-check.enabled=false

# ============================================================
# SECONDARY DATABASE - SQLITE (Untuk Session/Log)
# ============================================================
# Gunakan datasource name yang berbeda untuk SQLite
# Atau jika ingin menggunakan 2 datasource, tambahkan nama
quarkus.datasource."sqlite".db-kind=sqlite
quarkus.datasource."sqlite".jdbc.url=jdbc:sqlite:./session_log.db
quarkus.datasource."sqlite".jdbc.min-size=1
quarkus.datasource."sqlite".jdbc.max-size=10

# Hibernate ORM untuk SQLite
quarkus.hibernate-orm."sqlite".dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm."sqlite".database.generation=update
quarkus.hibernate-orm."sqlite".log.sql=true
quarkus.hibernate-orm."sqlite".log.format-sql=true

# ============================================================
# QUTE TEMPLATE ENGINE
# ============================================================
quarkus.qute.template-path=templates/
quarkus.qute.dev-mode=true
quarkus.qute.generate-static-pages=true
quarkus.qute.static-pages-output-dir=public

# ============================================================
# LOGGING CONFIGURATION
# ============================================================
# Root log level - hanya sekali!
quarkus.log.level=DEBUG

# SQL Logging
quarkus.log.category."org.hibernate.SQL".level=DEBUG
quarkus.log.category."org.hibernate.type.descriptor.sql".level=TRACE

# RESTEasy Logging
quarkus.log.category."org.jboss.resteasy".level=DEBUG
quarkus.log.category."io.quarkus.arc".level=DEBUG
quarkus.log.category."org.jboss.resteasy.resteasy_jaxrs".level=DEBUG
quarkus.log.category."org.jboss.resteasy.resteasy_jaxrs.i18n".level=DEBUG

# ============================================================
# ARC (CDI) CONFIGURATION
# ============================================================
quarkus.arc.strict-compatibility=true
quarkus.arc.dev-mode.monitoring-enabled=true

# ============================================================
# JWT CONFIGURATION
# ============================================================
jwt.token.duration.hours=8
jwt.secret.key=MyVerySecretKeyForJWT12345678901234567890