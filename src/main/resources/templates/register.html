<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .register-container h2 {
            text-align: center;
            color: #333;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            font-weight: 500;
            font-size: 14px;
            color: #555;
        }

        .form-group .form-control {
            border: 2px solid #e1e5e9;
            border-radius: 6px;
            padding: 12px;
            font-size: 15px;
        }

        .form-group .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-group-text {
            background: #f8f9fa;
            border: 2px solid #e1e5e9;
            border-right: none;
            color: #888;
        }

        .input-group .form-control {
            border-left: none;
        }

        /* Password Requirements - Hidden by default */
        .password-requirements {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
            padding: 10px 12px;
            background: #f8f9fa;
            border-radius: 6px;
            display: none;
            /* HIDDEN BY DEFAULT */
            animation: slideDown 0.3s ease;
        }

        .password-requirements.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .password-requirements ul {
            list-style: none;
            padding: 0;
            margin: 5px 0 0 0;
        }

        .password-requirements li {
            padding: 2px 0;
            color: #888;
            font-size: 12px;
            transition: all 0.3s;
        }

        .password-requirements li.valid {
            color: #28a745;
        }

        .password-requirements li.valid i {
            color: #28a745;
        }

        .password-requirements li.invalid {
            color: #dc3545;
        }

        .password-requirements li.invalid i {
            color: #dc3545;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .register-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 14px;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
        }

        .loading.show {
            display: block;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #ccc;
            font-size: 12px;
        }

        .password-strength {
            height: 4px;
            margin-top: 6px;
            border-radius: 2px;
            background: #e1e5e9;
            transition: all 0.3s;
            display: none;
        }

        .password-strength.show {
            display: block;
        }

        .password-strength.weak {
            background: #dc3545;
            width: 25%;
        }

        .password-strength.medium {
            background: #ffc107;
            width: 50%;
        }

        .password-strength.strong {
            background: #28a745;
            width: 75%;
        }

        .password-strength.very-strong {
            background: #28a745;
            width: 100%;
        }

        .strength-text {
            font-size: 11px;
            margin-top: 4px;
            text-align: right;
            display: none;
        }

        .strength-text.show {
            display: block;
        }

        .strength-text.weak {
            color: #dc3545;
        }

        .strength-text.medium {
            color: #ffc107;
        }

        .strength-text.strong {
            color: #28a745;
        }

        .form-text {
            font-size: 12px;
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <div class="register-container">
        <h2><i class="fas fa-user-plus text-primary me-2"></i>Register</h2>
        <p class="subtitle">Create your account</p>

        <div id="alertContainer"></div>

        <form id="registerForm">
            <div class="form-group row">
                <label class="col-md-3 col-form-label" for="username">Username</label>
                <div class="col-md-9">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" id="username" name="username" class="form-control"
                            placeholder="Choose a username" required autofocus>
                    </div>
                </div>
            </div>

            <div class="form-group row">
                <label class="col-md-3 col-form-label" for="email">Email</label>
                <div class="col-md-9">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email"
                            required>
                    </div>
                </div>
            </div>

            <div class="form-group row">
                <label class="col-md-3 col-form-label" for="password">Password</label>
                <div class="col-md-9">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" id="password" name="password" class="form-control"
                            placeholder="Create a password" required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="col-md-12">
                    <!-- Strength Bar - Hidden by default -->
                    <div class="password-strength" id="passwordStrength"></div>
                    <div class="strength-text" id="strengthText"></div>

                    <!-- Password Requirements - Hidden by default -->
                    <div class="password-requirements" id="passwordRequirements">
                        <small class="text-muted"><i class="fas fa-info-circle me-1"></i>Password must have:</small>
                        <ul>
                            <li id="reqLength" class="invalid">
                                <i class="fas fa-circle me-1" style="font-size:6px;"></i>At least 8 characters
                            </li>
                            <li id="reqUpper" class="invalid">
                                <i class="fas fa-circle me-1" style="font-size:6px;"></i>At least one uppercase letter
                            </li>
                            <li id="reqLower" class="invalid">
                                <i class="fas fa-circle me-1" style="font-size:6px;"></i>At least one lowercase letter
                            </li>
                            <li id="reqDigit" class="invalid">
                                <i class="fas fa-circle me-1" style="font-size:6px;"></i>At least one number
                            </li>
                            <li id="reqSpecial" class="invalid">
                                <i class="fas fa-circle me-1" style="font-size:6px;"></i>At least one special character
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="form-group row">
                <label class="col-md-3 col-form-label" for="confirmPassword">Re-Password</label>
                <div class="col-md-9">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-check"></i></span>
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                            placeholder="Confirm your password" required>
                    </div>
                    <div id="confirmMessage" class="form-text"></div>
                </div>
            </div>

            <button type="submit" class="register-btn" id="registerBtn">
                <i class="fas fa-user-plus me-2"></i>Create Account
            </button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="text-muted mt-2" style="font-size:14px;">Creating account...</p>
        </div>

        <div class="login-link">
            Already have an account? <a href="/login"><i class="fas fa-sign-in-alt me-1"></i>Sign in</a>
        </div>

        <div class="footer">
            <span class="version text-muted">v1.0.0</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function () {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                icon.className = 'fas fa-eye';
            }
        });

        // ============================================================
        // PASSWORD STRENGTH CHECKER WITH SHOW/HIDE
        // ============================================================
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');
        const strengthBar = document.getElementById('passwordStrength');
        const strengthText = document.getElementById('strengthText');
        const confirmMessage = document.getElementById('confirmMessage');
        const requirementsDiv = document.getElementById('passwordRequirements');

        const reqLength = document.getElementById('reqLength');
        const reqUpper = document.getElementById('reqUpper');
        const reqLower = document.getElementById('reqLower');
        const reqDigit = document.getElementById('reqDigit');
        const reqSpecial = document.getElementById('reqSpecial');

        let isRequirementsVisible = false;

        passwordInput.addEventListener('focus', function () {
            // Show requirements when password field gets focus
            if (this.value.length === 0) {
                requirementsDiv.classList.add('show');
                isRequirementsVisible = true;
            }
        });

        passwordInput.addEventListener('input', function () {
            const password = this.value;

            // Show requirements when user starts typing
            if (password.length > 0 && !isRequirementsVisible) {
                requirementsDiv.classList.add('show');
                strengthBar.classList.add('show');
                strengthText.classList.add('show');
                isRequirementsVisible = true;
            }

            // Check strength
            checkPasswordStrength(password);
            checkConfirmPassword();

            // Hide requirements if password is empty
            if (password.length === 0) {
                requirementsDiv.classList.remove('show');
                strengthBar.classList.remove('show');
                strengthText.classList.remove('show');
                isRequirementsVisible = false;

                // Reset requirements
                resetRequirements();
            }
        });

        function resetRequirements() {
            const items = [reqLength, reqUpper, reqLower, reqDigit, reqSpecial];
            items.forEach(item => {
                item.className = 'invalid';
                const icon = item.querySelector('i');
                icon.className = 'fas fa-circle me-1';
                icon.style.fontSize = '6px';
            });
            strengthBar.className = 'password-strength';
            strengthText.textContent = '';
            strengthText.className = 'strength-text';
        }

        function checkPasswordStrength(password) {
            const checks = {
                length: password.length >= 8,
                upper: /[A-Z]/.test(password),
                lower: /[a-z]/.test(password),
                digit: /[0-9]/.test(password),
                special: /[^A-Za-z0-9]/.test(password)
            };

            updateRequirement(reqLength, checks.length);
            updateRequirement(reqUpper, checks.upper);
            updateRequirement(reqLower, checks.lower);
            updateRequirement(reqDigit, checks.digit);
            updateRequirement(reqSpecial, checks.special);

            const score = Object.values(checks).filter(Boolean).length;
            updateStrengthBar(score);
        }

        function updateRequirement(element, isValid) {
            element.className = isValid ? 'valid' : 'invalid';
            const icon = element.querySelector('i');
            if (isValid) {
                icon.className = 'fas fa-check-circle me-1';
                icon.style.fontSize = '12px';
            } else {
                icon.className = 'fas fa-circle me-1';
                icon.style.fontSize = '6px';
            }
        }

        function updateStrengthBar(score) {
            const levels = [
                { score: 0, class: '', text: '' },
                { score: 1, class: 'weak', text: 'Weak' },
                { score: 2, class: 'weak', text: 'Weak' },
                { score: 3, class: 'medium', text: 'Medium' },
                { score: 4, class: 'strong', text: 'Strong' },
                { score: 5, class: 'very-strong', text: 'Very Strong' }
            ];
            const level = levels[score] || levels[0];
            strengthBar.className = 'password-strength show ' + level.class;
            strengthText.textContent = level.text;
            strengthText.className = 'strength-text show ' + level.class;
        }

        // ============================================================
        // CONFIRM PASSWORD CHECK
        // ============================================================
        confirmInput.addEventListener('input', function () {
            checkConfirmPassword();
        });

        function checkConfirmPassword() {
            const password = passwordInput.value;
            const confirm = confirmInput.value;
            if (confirm.length === 0) {
                confirmMessage.textContent = '';
                confirmInput.className = 'form-control';
                return;
            }
            if (password === confirm) {
                confirmMessage.innerHTML = '<i class="fas fa-check-circle text-success me-1"></i>Passwords match!';
                confirmMessage.className = 'form-text text-success';
                confirmInput.className = 'form-control is-valid';
            } else {
                confirmMessage.innerHTML = '<i class="fas fa-exclamation-circle text-danger me-1"></i>Passwords do not match';
                confirmMessage.className = 'form-text text-danger';
                confirmInput.className = 'form-control is-invalid';
            }
        }

        // ============================================================
        // FORM SUBMIT
        // ============================================================
        document.getElementById('registerForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validations
            if (!username || username.length < 3) {
                showAlert('Username must be at least 3 characters', 'danger');
                return;
            }
            if (!email || !email.includes('@')) {
                showAlert('Please enter a valid email address', 'danger');
                return;
            }
            if (password.length < 8) {
                showAlert('Password must be at least 8 characters', 'danger');
                return;
            }
            if (password !== confirmPassword) {
                showAlert('Passwords do not match', 'danger');
                return;
            }

            // Show loading
            document.getElementById('loading').classList.add('show');
            document.getElementById('registerBtn').disabled = true;
            document.getElementById('registerBtn').innerHTML =
                '<span class="spinner-border spinner-border-sm me-2"></span>Creating...';

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                document.getElementById('loading').classList.remove('show');
                document.getElementById('registerBtn').disabled = false;
                document.getElementById('registerBtn').innerHTML =
                    '<i class="fas fa-user-plus me-2"></i>Create Account';

                if (response.status === 201) {
                    showAlert('Account created successfully! Redirecting to login...', 'success');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    showAlert(data.message || 'Registration failed. Please try again.', 'danger');
                }
            } catch (error) {
                console.error('Register error:', error);
                document.getElementById('loading').classList.remove('show');
                document.getElementById('registerBtn').disabled = false;
                document.getElementById('registerBtn').innerHTML =
                    '<i class="fas fa-user-plus me-2"></i>Create Account';
                showAlert('Network error. Please try again.', 'danger');
            }
        });

        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type} alert-dismissible fade show`;
            alert.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'} me-2"></i>
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            container.innerHTML = '';
            container.appendChild(alert);
            setTimeout(() => {
                if (alert.parentNode) alert.remove();
            }, 5000);
        }
    </script>
</body>

</html>
