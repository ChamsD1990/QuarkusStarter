<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{title}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cdbootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cdbootstrap/css/cdb.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 100vw;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            color: #fff;
            font-size: 24px;
            margin: 0;
        }

        .header h1 i {
            color: #4CAF50;
        }

        .btn-exit {
            background: rgba(220, 53, 69, 0.2);
            color: #dc3545;
            border: 1px solid #dc3545;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-exit:hover {
            background: #dc3545;
            color: white;
            transform: scale(1.05);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            border-color: rgba(76, 175, 80, 0.3);
        }

        .stat-card .number {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
        }

        .stat-card .label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .icon {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .stat-card.success .number {
            color: #4CAF50;
        }

        .stat-card.danger .number {
            color: #f44336;
        }

        .stat-card.warning .number {
            color: #ff9800;
        }

        .stat-card.info .number {
            color: #2196F3;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .card h3 {
            color: #fff;
            font-size: 16px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card h3 .badge-status {
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
        }

        .card h3 .badge-status.running {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        .chart-container canvas {
            width: 100% !important;
            height: 100% !important;
        }

        /* Tooltip Custom */
        .chart-tooltip {
            background: rgba(0, 0, 0, 0.9) !important;
            border-radius: 8px !important;
            padding: 12px !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
        }

        .chart-tooltip .tooltip-title {
            color: #fff;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .chart-tooltip .tooltip-item {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 2px 0;
            font-size: 12px;
        }

        .chart-tooltip .tooltip-item .value {
            font-weight: bold;
        }

        .chart-tooltip .tooltip-item .value.success {
            color: #4CAF50;
        }

        .chart-tooltip .tooltip-item .value.danger {
            color: #f44336;
        }

        .chart-tooltip .tooltip-item .value.warning {
            color: #ff9800;
        }

        .footer {
            text-align: center;
            margin-top: 10px;
            padding: 12px 24px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50px;
            backdrop-filter: blur(10px);
            display: inline-block;
            width: auto;
            max-width: 95%;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
            white-space: nowrap;
        }

        .footer #serverTime {
            color: #4CAF50;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            background: rgba(76, 175, 80, 0.15);
            padding: 2px 10px;
            border-radius: 4px;
        }

        .clock-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #4CAF50;
            border-radius: 50%;
            margin: 0 6px;
            animation: blink 1s infinite;
            vertical-align: middle;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.2;
            }
        }

        .footer .elapsed {
            color: #ff9800;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }

        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }

            .footer {
                white-space: normal;
                font-size: 10px;
                display: block;
                width: 95%;
                border-radius: 12px;
            }

            .chart-container {
                height: 250px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header row align-items-center">
            <div class="col-md-6">
                <h1><i class="fas fa-chart-line"></i> {title}</h1>
            </div>
            <div class="col-md-6 text-end">
                <button class="btn-exit" id="btnLogout">
                    <i class="fas fa-sign-out-alt"></i> Exit
                </button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card success">
                <div class="icon">✅</div>
                <div class="number" id="totalSuccess">0</div>
                <div class="label">Success</div>
            </div>
            <div class="stat-card danger">
                <div class="icon">❌</div>
                <div class="number" id="totalError">0</div>
                <div class="label">Error</div>
            </div>
            <div class="stat-card warning">
                <div class="icon">⚠️</div>
                <div class="number" id="totalWarning">0</div>
                <div class="label">Warning</div>
            </div>
            <div class="stat-card info">
                <div class="icon">📊</div>
                <div class="number" id="totalJobs">0</div>
                <div class="label">Total Jobs</div>
            </div>
        </div>

        <!-- Charts -->
        <div class="content-grid">
            <!-- Chart 1: Realtime (incremental every 10s) -->
            <div class="card">
                <h3>
                    <span><i class="fas fa-sync fa-spin" style="color:#4CAF50;"></i> Realtime Graph</span>
                    <span class="badge-status running" id="liveStatus">● LIVE</span>
                </h3>
                <div class="chart-container">
                    <canvas id="realtimeChart"></canvas>
                </div>
            </div>

            <!-- Chart 2: Summary -->
            <div class="card">
                <h3>
                    <span><i class="fas fa-chart-bar" style="color:#2196F3;"></i> Summary Graph</span>
                    <span class="badge-status" id="summaryStatus">● Summary</span>
                </h3>
                <div class="chart-container">
                    <canvas id="summaryChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            © <span id="currentYear"></span> Attendance System v<span id="version">1.0.0</span> |
            Server Time: <span id="serverTime"></span>
            <span class="clock-dot"></span>
            <span id="elapsedDisplay">| Running: 00:00:00</span>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. LOGOUT
        // ============================================================
        document.getElementById('btnLogout').addEventListener("click", function (e) {
            console.log("Logout button clicked!", e);
            if (confirm('Are you sure you want to logout?')) {
                localStorage.clear();
                window.location.href = '/login';
            }
        });

        // ============================================================
        // 2. FOOTER CLOCK
        // ============================================================
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        const startServer = "{serverTime}" || new Date().toISOString().replace('T', ' ').slice(0, 19);

        function parseServerTime(dateStr) {
            const parts = dateStr.split(' ');
            const dateParts = parts[0].split('-');
            const timeParts = parts[1].split(':');
            return new Date(
                parseInt(dateParts[0]),
                parseInt(dateParts[1]) - 1,
                parseInt(dateParts[2]),
                parseInt(timeParts[0]),
                parseInt(timeParts[1]),
                parseInt(timeParts[2])
            );
        }

        const startTime = parseServerTime(startServer);

        function updateTimer() {
            const now = new Date();
            const elapsed = Math.floor((now - startTime) / 1000);
            const hours = String(Math.floor(elapsed / 3600)).padStart(2, '0');
            const minutes = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
            const seconds = String(elapsed % 60).padStart(2, '0');

            const currentTime = new Date(startTime.getTime() + elapsed * 1000);
            const year = currentTime.getFullYear();
            const month = String(currentTime.getMonth() + 1).padStart(2, '0');
            const day = String(currentTime.getDate()).padStart(2, '0');
            const hrs = String(currentTime.getHours()).padStart(2, '0');
            const mins = String(currentTime.getMinutes()).padStart(2, '0');
            const secs = String(currentTime.getSeconds()).padStart(2, '0');

            document.getElementById('serverTime').textContent = year + "-"+ month + "-"+ day + " " + hrs + ":" + mins + ":" + secs;
            document.getElementById('elapsedDisplay').textContent = " | Running: " + (hours*1)+ ":"+ (minutes*-1) + ":"+ (seconds*-1);
        }

        updateTimer();
        setInterval(updateTimer, 1000);

        // ============================================================
        // 3. GENERATE RANDOM DATA (simulasi job)
        // ============================================================
        function generateJobData() {
            const statuses = ['success', 'error', 'warning'];
            const weights = [0.7, 0.15, 0.15];
            let r = Math.random();
            let sum = 0;
            for (let i = 0; i < weights.length; i++) {
                sum += weights[i];
                if (r <= sum) return statuses[i];
            }
            return 'success';
        }

        // ============================================================
        // 4. CHART 1: REALTIME (incremental every 10s)
        // ============================================================
        const realtimeCtx = document.getElementById('realtimeChart').getContext('2d');
        let realtimeLabels = [];
        let successData = [];
        let errorData = [];
        let warningData = [];

        // Inisialisasi dengan data awal
        for (let i = 0; i < 10; i++) {
            const time = new Date(Date.now() - (10 - i) * 10000);
            realtimeLabels.push(time.toLocaleTimeString());
            successData.push(Math.floor(Math.random() * 20) + 5);
            errorData.push(Math.floor(Math.random() * 5));
            warningData.push(Math.floor(Math.random() * 5));
        }

        const realtimeChart = new Chart(realtimeCtx, {
            type: 'line',
            data: {
                labels: realtimeLabels,
                datasets: [{
                    label: '✅ Success',
                    data: successData,
                    borderColor: '#4CAF50',
                    backgroundColor: 'rgba(76, 175, 80, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.3,
                    pointRadius: 3,
                    pointBackgroundColor: '#4CAF50'
                }, {
                    label: '❌ Error',
                    data: errorData,
                    borderColor: '#f44336',
                    backgroundColor: 'rgba(244, 67, 54, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.3,
                    pointRadius: 3,
                    pointBackgroundColor: '#f44336'
                }, {
                    label: '⚠️ Warning',
                    data: warningData,
                    borderColor: '#ff9800',
                    backgroundColor: 'rgba(255, 152, 0, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.3,
                    pointRadius: 3,
                    pointBackgroundColor: '#ff9800'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        labels: {
                            color: '#fff',
                            usePointStyle: true,
                            padding: 15
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(0,0,0,0.9)',
                        titleColor: '#fff',
                        bodyColor: '#fff',
                        cornerRadius: 8,
                        padding: 12,
                        callbacks: {
                            afterBody: function (tooltipItems) {
                                let total = 0;
                                tooltipItems.forEach(item => {
                                    total += item.parsed.y;
                                });
                                return "📊 Total: "+ total;
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        ticks: { color: 'rgba(255,255,255,0.6)', maxTicksLimit: 15 },
                        grid: { color: 'rgba(255,255,255,0.05)' }
                    },
                    y: {
                        beginAtZero: true,
                        ticks: { color: 'rgba(255,255,255,0.6)', stepSize: 5 },
                        grid: { color: 'rgba(255,255,255,0.05)' }
                    }
                },
                interaction: {
                    intersect: false,
                    mode: 'index'
                }
            }
        });

        // ============================================================
        // 5. CHART 2: SUMMARY (from dataText)
        // ============================================================
        const summaryCtx = document.getElementById('summaryChart').getContext('2d');

        // Parse timings from server
        let summaryLabels = [];
        let summaryData = [];

        try {
            const dataText = "{timings}";
            const parser = new DOMParser();
            const decoded = parser.parseFromString(dataText, 'text/html').body.textContent;
            summaryLabels = JSON.parse(decoded);
            console.log('📊 Summary Labels:', summaryLabels);
        } catch (e) {
            summaryLabels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            console.warn('Using default labels');
        }

        // Generate summary data
        summaryData = summaryLabels.map(() => Math.floor(Math.random() * 8000) + 2000);

        const summaryChart = new Chart(summaryCtx, {
            type: 'bar',
            data: {
                labels: summaryLabels,
                datasets: [{
                    label: '📊 Attendance',
                    data: summaryData,
                    backgroundColor: summaryData.map(v => {
                        if (v > 7000) return 'rgba(76, 175, 80, 0.7)';
                        if (v > 4000) return 'rgba(33, 150, 243, 0.7)';
                        return 'rgba(255, 152, 0, 0.7)';
                    }),
                    borderColor: summaryData.map(v => {
                        if (v > 7000) return '#4CAF50';
                        if (v > 4000) return '#2196F3';
                        return '#ff9800';
                    }),
                    borderWidth: 2,
                    borderRadius: 6,
                    barPercentage: 0.6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        labels: {
                            color: '#fff',
                            usePointStyle: true
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(0,0,0,0.9)',
                        titleColor: '#fff',
                        bodyColor: '#fff',
                        cornerRadius: 8,
                        padding: 12,
                        callbacks: {
                            label: function (context) {
                                return "Attendance: "+context.parsed.y.toLocaleString();
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        ticks: { color: 'rgba(255,255,255,0.6)' },
                        grid: { color: 'rgba(255,255,255,0.05)' }
                    },
                    y: {
                        beginAtZero: true,
                        ticks: { color: 'rgba(255,255,255,0.6)', stepSize: 1000 },
                        grid: { color: 'rgba(255,255,255,0.05)' }
                    }
                }
            }
        });

        // ============================================================
        // 6. UPDATE REALTIME CHART EVERY 10 SECONDS
        // ============================================================
        function updateRealtimeChart() {
            const now = new Date();
            const timeLabel = now.toLocaleTimeString();

            // Generate new job data
            const success = Math.floor(Math.random() * 15) + 5;
            const error = Math.floor(Math.random() * 8);
            const warning = Math.floor(Math.random() * 6);

            // Add new data
            realtimeLabels.push(timeLabel);
            successData.push(success);
            errorData.push(error);
            warningData.push(warning);

            // Keep only last 20 points
            if (realtimeLabels.length > 20) {
                realtimeLabels.shift();
                successData.shift();
                errorData.shift();
                warningData.shift();
            }

            // Update chart
            realtimeChart.data.labels = realtimeLabels;
            realtimeChart.data.datasets[0].data = successData;
            realtimeChart.data.datasets[1].data = errorData;
            realtimeChart.data.datasets[2].data = warningData;
            realtimeChart.update('none');

            // Update stats
            updateStats(success, error, warning);

            console.log("📊 Update: ✅"+success+" ❌"+error+" ⚠️"+warning);
        }

        // ============================================================
        // 7. UPDATE STATS
        // ============================================================
        let totalSuccess = 0,
            totalError = 0,
            totalWarning = 0;

        function updateStats(s, e, w) {
            totalSuccess += s;
            totalError += e;
            totalWarning += w;

            document.getElementById('totalSuccess').textContent = totalSuccess;
            document.getElementById('totalError').textContent = totalError;
            document.getElementById('totalWarning').textContent = totalWarning;
            document.getElementById('totalJobs').textContent = totalSuccess + totalError + totalWarning;
        }

        // Inisialisasi stats
        updateStats(0, 0, 0);

        // ============================================================
        // 8. START REALTIME UPDATES
        // ============================================================
        // Update every 10 seconds
        setInterval(updateRealtimeChart, 10000);

        // Update status indicator
        setInterval(() => {
            const status = document.getElementById('liveStatus');
            status.style.opacity = status.style.opacity === '0.3' ? '1' : '0.3';
        }, 1000);

        // ============================================================
        // 9. RESIZE HANDLER
        // ============================================================
        window.addEventListener('resize', function () {
            realtimeChart.resize();
            summaryChart.resize();
        });

        // ============================================================
        // 10. TOOLTIP CUSTOM - Show list on hover
        // ============================================================
        // Chart.js already shows tooltips with all datasets
        // The tooltip will show Success, Error, Warning values

        console.log('✅ Dashboard initialized!');
        console.log('📊 Realtime chart updates every 10 seconds');
        console.log('📊 Summary chart loaded');
    </script>
</body>

</html>
