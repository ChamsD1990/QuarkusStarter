<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{title}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cdbootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cdbootstrap/css/cdb.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 100vw;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 25px 30px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .header h1,
        header .subtitle {
            margin: 0;
        }

        .header h1 {
            color: #1a237e;
            font-size: 28px;
            margin-bottom: 5px;
            }
            /* 

        .header .subtitle {
            color: #666;
            font-size: 14px;
            text-align: left;
        }

        .header .subtitle strong {
            color: #1a237e;
        } */

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
        }

        .stat-card .icon {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-card .label {
            color: #666;
            font-size: 14px;
        }

        .stat-card.primary .number {
            color: #1976d2;
        }

        .stat-card.success .number {
            color: #388e3c;
        }

        .stat-card.warning .number {
            color: #f57c00;
        }

        .stat-card.danger .number {
            color: #d32f2f;
        }

        .stat-card.info .number {
            color: #0097a7;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #f0f2f5;
            padding-bottom: 12px;
            font-size: 18px;
        }

        .activity-item {
            padding: 12px 0;
            border-bottom: 1px solid #f0f2f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-item .time {
            color: #999;
            font-size: 12px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-login {
            background: #e8f5e9;
            color: #388e3c;
        }

        .badge-logout {
            background: #fff3e0;
            color: #f57c00;
        }

        .badge-attendance {
            background: #e1f5fe;
            color: #0097a7;
        }

        .quick-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .quick-actions a {
            display: block;
            padding: 14px;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .quick-actions a:hover {
            transform: scale(1.02);
        }

        .btn-primary {
            background: #1976d2;
            color: white;
        }

        .btn-success {
            background: #388e3c;
            color: white;
        }

        .btn-warning {
            background: #f57c00;
            color: white;
        }

        .btn-info {
            background: #0097a7;
            color: white;
        }

.footer {
    text-align: center;
    margin-top: 10px;
    padding: 12px 20px;
    color: white;
    font-size: 12px;
    opacity: 0.9;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    backdrop-filter: blur(10px);
    display: inline-block;  /* ← INLINE */
    width: auto;            /* ← Lebar otomatis */
    max-width: 95%;
    margin-left: auto;
    margin-right: auto;
    border: 1px solid rgba(255, 255, 255, 0.1);
    white-space: nowrap;    /* ← Biar ga turun ke bawah */
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Dot berkedip */
.clock-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    background: #4CAF50;
    border-radius: 50%;
    margin: 0 6px;
    animation: blink 1s infinite;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
}

/* Warna highlight */
.footer #serverTime {
    padding: 2px;
    background: white;
    border: #e1f5fe;
    border-radius: 5px;
    color: #4CAF50;
    font-weight: bold;
    font-size: large;
    font-family: 'Courier New', monospace;
}

.footer .elapsed {
    color: #ff9800;
    font-weight: bold;
    font-family: 'Courier New', monospace;
}

.footer .version-badge {
    background: rgba(76, 175, 80, 0.3);
    padding: 1px 8px;
    border-radius: 10px;
    font-weight: bold;
    color: #4CAF50;
}

/* Responsive - kalo layar kecil jadi turun */
@media (max-width: 600px) {
    .footer {
        white-space: normal;
        font-size: 10px;
        padding: 8px 12px;
        display: block;
        width: 95%;
    }
}

        /* Chart container specific styles */
        .realtimeGraph {
            margin-bottom: 1px;
            position: relative;
            height: 75vh;
        }

        .realtimeGraph canvas {
            width: 100% !important;
            height: 90% !important;
        }

        .summaryResult {
            margin-bottom: 1px;
            position: relative;
            height: 75vh;
        }

        .summaryResult canvas {
            width: 100% !important;
            height: 90% !important;
        }

        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }

            .realtimeGraph, .summaryResult {
                height: 300px;
            }
        }
    </style>
    <!-- Use correct Font Awesome version -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/cdbootstrap/js/cdb.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cdbootstrap/js/bootstrap.min.js"></script>
    <!-- Load Chart.js first -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <div class="container"> 
        <div class="header row">
            <div class="col-xs-10 col-sm-10 col-md-10 row">
                <h1>📊 {title}</h1> 
            </div> 
            <div class="com-xs-2 col-sm-2 col-md-2 p-s0">
                <button class="btn btn-xs btn-default">
                    <i class="fas fa-sign-out-alt"></i> Exit
                </button>
            </div>
        </div>
        <div class="row">
          <div class="col-md-6"><div class="card realtimeGraph">
            <h3>📊 Realtime Graph</h3>
            <canvas id="LineChart"></canvas>
        </div>
          </div>
          <div class="col-md-6"><div class="card summaryResult">
            <h3>📊 Summary Graph</h3>
            <canvas id="attendanceChart"></canvas>
        </div>
          </div>
        </div>
        <div class="footer">
            © <span id="currentYear"></span> Attendance System v<span id="version"></span> |
            Server Time: <span id="serverTime"></span>
            <span class="clock-dot"></span>
            <span id="elapsedDisplay">| Running: 00:00:00</span>
        </div>
    </div>

  <script> 
    document.addEventListener('DOMContentLoaded', function () {
            const dataText = "{timings}"; 
            const parser = new DOMParser();
            const decoded = parser.parseFromString(dataText, 'text/html').body.textContent;
            const timingsArray = JSON.parse(decoded);
            console.log(timingsArray);
            
            const ctx = document.getElementById('attendanceChart').getContext('2d'); 
            const myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'],
                    datasets: [{
                        label: 'Attendance',
                        data: [3000, 4000, 2000, 5000, 8000, 9000, 2000],
                        backgroundColor: 'rgba(54, 162, 235, 0.2)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 3,
                        tension: 0.4,
                        fill: true,
                        pointBackgroundColor: 'rgba(54, 162, 235, 1)',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 5,
                        pointHoverRadius: 7
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                usePointStyle: true,
                                padding: 20
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(0,0,0,0.8)',
                            titleColor: '#fff',
                            bodyColor: '#fff',
                            cornerRadius: 8,
                            padding: 12
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1000,
                                font: {
                                    size: 12
                                }
                            },
                            grid: {
                                color: 'rgba(0,0,0,0.05)'
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                font: {
                                    size: 12
                                }
                            }
                        }
                    },
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    }
                }
            });
 
            
            const ctxLine = document.getElementById('LineChart').getContext('2d');  
            const ChartLine = new Chart(ctxLine, {
                type: 'line',
                data: {
                    labels: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'],
                    datasets: [{
                        label: 'Attendance',
                        data: [3000, 4000, 2000, 5000, 8000, 9000, 2000],
                        backgroundColor: 'rgba(255, 255, 255, 0)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 3,
                        tension: 0.4,
                        fill: true,
                        pointBackgroundColor: 'rgba(54, 162, 235, 0)',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 5,
                        pointHoverRadius: 7
                    }]
                },  
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                usePointStyle: true,
                                padding: 20,
                                font: {
                                    size: 14,
                                    weight: 'bold'
                                }
                            }
                        },
                    }
                }
            });
      const startServer = "{serverTime}"; 

        // Fungsi parse string ke Date object
        function parseServerTime(dateStr) {
            const parts = dateStr.split(' ');
            const dateParts = parts[0].split('-');
            const timeParts = parts[1].split(':');

            return new Date(
                parseInt(dateParts[0]),      // year
                parseInt(dateParts[1]) - 1,  // month (0-based)
                parseInt(dateParts[2]),      // day
                parseInt(timeParts[0]),      // hours
                parseInt(timeParts[1]),      // minutes
                parseInt(timeParts[2])       // seconds
            );
        }

        // Waktu awal
        const startTime = parseServerTime(startServer);
        function updateTimer() {
            const now = new Date();
            const elapsed = Math.floor((now - startTime) / 1000); // detik yang berlalu

            // Hitung selisih waktu
            const hours = String(Math.floor(elapsed / 3600)).padStart(2, '0');
            const minutes = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
            const seconds = String(elapsed % 60).padStart(2, '0');

            // Format waktu saat ini (startServer + elapsed)
            const currentTime = new Date(startTime.getTime() + elapsed * 1000);

            const year = currentTime.getFullYear();
            const month = String(currentTime.getMonth() + 1).padStart(2, '0');
            const day = String(currentTime.getDate()).padStart(2, '0');
            const hrs = String(currentTime.getHours()).padStart(2, '0');
            const mins = String(currentTime.getMinutes()).padStart(2, '0');
            const secs = String(currentTime.getSeconds()).padStart(2, '0');

            const formattedTime = ""+year+"-"+month+"-"+day+" "+hrs+":"+ mins+":"+secs+"";
            const elapsedFormatted = hours+":"+minutes+":"+seconds;

            // Update DOM
            document.getElementById('serverTime').textContent = formattedTime;
            document.getElementById('elapsedDisplay').textContent = elapsedFormatted;
        }

        // Jalankan pertama kali

        setInterval(updateTimer, 1000);
            window.addEventListener('resize', function () {
                updateTimer();
                myChart.resize(); 
                ChartLine.resize();
            });
        });
    </script>
</body>

</html>
